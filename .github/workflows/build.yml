name: Build APK & Web Client

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Modern Android sdkmanager requires JDK 17+
      - name: Set up JDK 17 for Android SDK Manager
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android 10 (API 10) & Build Tools 25.0.2
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-10" "build-tools;25.0.2"

      # Gradle 2.10 & API 10 build require JDK 8
      - name: Switch to JDK 8 for Camera App Build
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build Camera APK
        working-directory: camera-app
        run: ./gradlew assembleDebug

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web-client/package-lock.json

      - name: Build Web Client (Single-File HTML)
        working-directory: web-client
        run: |
          npm ci
          npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sony-pmca-webcontrol-dist
          path: |
            camera-app/app/build/outputs/apk/*.apk
            web-client/dist/index.html

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            camera-app/app/build/outputs/apk/*.apk
            web-client/dist/index.html
